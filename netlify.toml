# Netlify deploy config for the BeFree marketing site.
# This folder is the repo root — connect it to Netlify, or drag-and-drop dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security + privacy headers (no trackers; lock down framing & sniffing).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

# Long-cache the fingerprinted build assets (fonts, hashed CSS/JS).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
